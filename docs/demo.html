<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVLaTeX — 45-second demo</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f7fb; --card:#fff; --text:#172033; --muted:#5d6b82; --accent:#1f4e79; --border:#d7e0ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161b24; --card:#1f2631; --text:#eef2f8; --muted:#aab6c8; --accent:#7fb2e5; --border:#334052; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:min(960px, 100%); background:var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; box-shadow:0 18px 50px rgba(20,35,60,.14); }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0; color:var(--accent); }
  p { margin:0; color:var(--muted); font-size:14px; }
  video { display:block; width:100%; height:auto; border-radius:10px; background:#000; border:1px solid var(--border); }
  footer { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; font-size:13px; }
  a { color:var(--accent); }
  .download { display:inline-block; padding:8px 12px; border:1px solid var(--border); border-radius:7px; text-decoration:none; }
  .download:hover { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>CVLaTeX — 45-second demo</h1>
    <p>Form → templates → Chinese CV → exports</p>
  </header>
  <video controls playsinline preload="metadata" poster="media/images/demo-poster.png">
    <source src="media/videos/demo-en.mp4" type="video/mp4">
    Your browser cannot play this video. <a href="media/videos/demo-en.mp4">Download it</a>.
  </video>
  <footer>
    <span>Recorded on the v1.0 build. No account, no cloud upload.</span>
    <a class="download" href="media/videos/demo-en.mp4" download>Download MP4 (1.3 MB)</a>
  </footer>
</main>
</body>
</html>
